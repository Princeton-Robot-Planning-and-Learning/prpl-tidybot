# Example marker layout for scripts/calibrate_camera_extrinsics.py.
#
# Keys are ArUco DICT_4X4_50 marker ids (print them with
# scripts/create_calibration_markers.py); values are the map-frame [x, y]
# (metres) of each marker's centre, taped flat on the floor.
#
# The positions define the map frame: wherever you say the markers are is
# where the world ends up. Measure them with a tape measure from your
# chosen origin, keeping the origin near the centre of the work area and
# the axes aligned with the existing map frame (x across the floor width,
# y along its length). If your floor happens to have a tile grid, tile
# intersections save the measuring — the values below are multiples of a
# 0.6096 m (2 ft) tile — but any measured positions work.
#
# Spread markers across each camera's view and include at least two near
# the floor midline (y = 0) so both cameras see them; each camera needs at
# least four (not all in a line), six or more recommended. Avoid the
# robot-sticker and target ids (10, 13, 17, 21, 23).
marker_positions:
  0: [-1.2192, 1.2192]
  1: [1.2192, 1.2192]
  2: [-0.6096, 0.0]
  3: [0.6096, 0.0]
  4: [-1.2192, -1.2192]
  5: [1.2192, -1.2192]
