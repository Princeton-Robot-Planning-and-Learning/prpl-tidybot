# Measured calibration-marker layout for the PRPL lab (2026-08-27).
#
# Map-frame [x, y] (metres) of each ArUco DICT_4X4_50 marker centre taped
# to the floor, used by scripts/calibrate_camera_extrinsics.py. These
# positions define the lab's map frame.
#
# The top-half positions (1, 2, 8) and midline anchors (0, 3) were
# measured by tape from the origin at marker 0 (2026-08-26) and are
# mutually consistent with the top camera's fit to ~6 mm. Markers 4-7 were
# re-derived by joint least-squares trilateration over nine tape pulls to
# the anchors (2026-08-27), after the bottom camera exposed errors in the
# originally recorded coordinates (marker 6 was 14 cm off, marker 7 6 cm);
# the solved coordinates reproduce every measured pull to <= 6 mm.
#
# Markers 1, 2, 8 lie in the top camera's half; 4, 5, 6 in the bottom
# camera's; 0 and 3 near the midline are visible to both cameras and drive
# the cross-camera consistency check.
marker_positions:
  0: [0, 0]
  1: [0, 1.665]
  2: [1.665, 1.665]
  3: [1.665, 0]
  4: [1.655, -1.186]
  5: [0.010, -1.170]
  6: [-1.575, -1.126]
  7: [-1.550, -0.031]
  8: [-1.5, 1.665]
