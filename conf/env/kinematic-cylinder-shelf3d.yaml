# kinder/KinematicCylinderShelf3D-o{N}-v0 — pick cylinders off the floor
# (side grasp, any approach angle) and place them upright on a shelf. The
# cylinders are the `cylinders` list below; everything else (the kinder
# variant, the planner's object count, the simulator's cylinder heights,
# both perceivers) derives from it. Bilevel-planning env model lives in
# kinder_bilevel_planning.env_models.kinematic3d.cylinder_shelf3d.

env_name: cylinder_shelf3d
num_cylinders: ${len:${env.cylinders}}
make_kwargs:
  id: kinder/KinematicCylinderShelf3D-o${env.num_cylinders}-v0
# Threads the perceiver's shelf_pose through to the bilevel-planning agent's
# internal CylinderShelf3DEnvConfig so the planner reasons about the shelf at
# the same location the perceiver reports it. Without this the env_model's
# internal sim would default to CylinderShelf3DEnvConfig.shelf_pose =
# (2.0, 2.4, 0.02) and the planner would emit base motion to the wrong place.
env_model_kwargs:
  num_objects: ${env.num_cylinders}
  magic_skills: ${env.magic_skills}
  place_params: ${pluck:place,${env.cylinders}}
  base_clearance: ${env.base_clearance}
  config:
    _target_: kinder.envs.kinematic3d.cylinder_shelf3d.CylinderShelf3DEnvConfig
    shelf_pose:
      _target_: pybullet_helpers.geometry.Pose
      position: ${env.shelf_pose}
    # Real-object geometry, threaded into the planner's internal sim and
    # the shadow sim so they simulate the physical cylinders. The kinder
    # env has one radius for all cylinders; the perceiver still reports
    # each cylinder's own radius, so use the most common one here.
    cylinder_radius: ${env.sim_cylinder_radius}
    cylinder_heights: ${pluck:height,${env.cylinders}}
    # Our physical shelf has its bottom inner board removed, leaving one
    # tall opening above the bottom board; the Pringles can (taller than a
    # regular board gap) is placed there.
    shelf_omitted_layers: [1]
    # Where the base motion planner may put the base (it samples poses
    # uniformly inside this box; the default is +-10 m). The map frame is
    # centred on the 6 x 6 tiles of 2 ft floor, so the floor edge is at
    # +-1.83 m; this keeps the sampled waypoints on the tiles, with room
    # for the place staging pose next to the shelf (x up to ~1.65).
    robot_base_pose_lower_bound: ${env.base_pose_lower_bound}
    robot_base_pose_upper_bound: ${env.base_pose_upper_bound}

# Skills planned as "magic": their low-level policy is not simulated. The
# planner records a SkillCall carrying the skill's predicted outcome, and
# the pipeline's gap executor carries the skill out at execution time (a
# teleport in sim mode; settling the robot to the predicted configuration
# in fake mode). The intended use is `env.magic_skills=[Grasp]`: the robot
# drives and reaches to the pre-grasp pose with planned motion and only
# the last mile (approach, close, stow) is left to the gap executor.
# "MoveToPreGrasp" and "Place" can be listed too.
magic_skills: []

# The physical cylinders, in the order the planner names them (cylinder0,
# cylinder1, ...). Each entry gives the ArUco marker taped flat on the
# floor under it (real mode; print them from
# conf/calibration/cylinder_markers.pdf), its radius and height in metres,
# where fake mode pretends it stands (fake_xy; the centre height is
# derived from the height), and how the planner places it on the shelf
# (place). Sim mode samples its own cylinder poses.
#
# place is [x, y, base_distance]: the cylinder's resting spot relative to
# the shelf (x along the shelf's width from its centre, y along its depth
# from 5 cm in front of its centre, positive = deeper in) and how far
# back the base stands for the place. With all three given the Place
# skill has nothing left to sample, so planning gets by with one abstract
# plan and one sample per step (`agent.max_abstract_plans=1
# agent.samples_per_step=1` on the CLI, ~1 s instead of ~10 s); [x, y]
# alone leaves the base distance to the sampler, and null samples
# everything.
# Keep |x| < 0.15 (the OnFixture predicate's tolerance about the shelf
# centre) and y <= 0 (deeper spots are unreachable: the held cylinder
# hits the board above). The base distance must be >= 0.84 for the short
# can and >= 0.80 for the tall ones; 0.86 works for all three.
#
# Staging protocol (real mode): every marker must be visible when the
# rollout starts — the perceiver reads all of them once at reset (a
# covered, never-seen marker fails the rollout with a RuntimeError) — and
# the cylinders are set down on their markers during the preview pause.
# Covering the markers afterwards is fine; nothing re-queries them.
cylinders:
  # tall Pringles can
  - {marker_id: 35, radius: 0.039, height: 0.233, fake_xy: [0.5, 0.0], place: [-0.12, -0.05, 0.86]}
  # short Pringles can
  - {marker_id: 36, radius: 0.039, height: 0.120, fake_xy: [0.3, 0.6], place: [0.0, -0.05, 0.86]}
  # Lysol can
  - {marker_id: 37, radius: 0.040, height: 0.210, fake_xy: [0.3, -0.6], place: [0.12, -0.05, 0.86]}
# Radius the simulator uses for every cylinder (see env_model_kwargs).
sim_cylinder_radius: 0.039

# Distance (m) the base keeps from the shelf and the cylinders along its
# planned paths. The planner's collision check is otherwise contact-only
# and the RRT's smoothing pulls paths straight, so without this a path
# grazes a can with millimetres of modelled clearance; the real base has
# cables sticking out past its chassis and tracks the plan to ~2 cm.
base_clearance: 0.05

# Base motion planning box (see env_model_kwargs.config): SE2 poses the
# base motion planner is allowed to sample. Rotation bounds are +-pi.
base_pose_lower_bound:
  _target_: pybullet_helpers.geometry.SE2Pose
  x: -1.5
  y: -1.5
  rot: -3.141592653589793
base_pose_upper_bound:
  _target_: pybullet_helpers.geometry.SE2Pose
  x: 1.7
  y: 1.5
  rot: 3.141592653589793

# Static shelf pose threaded into the perceiver. Matches the value used for
# the Shelf3D env so the same physical shelf staging works for both;
# override here per-lab once the real shelf is staged.
shelf_pose: [1.5, 1.5, 0.02]

# The pick skill's planar reach is discretized at ~2.5 cm, so one
# pick rollout (base navigation + reach + close + stow) runs a few
# hundred ticks — beyond the global default skill horizon of 100.
agent_max_skill_horizon: 400

# Streaming arm executor knobs — see conf/env/kinematic-shelf3d-o1.yaml for
# the full rationale. arm_advance_radius is tighter here than in the shelf
# env: the planar reach/place plans are remapped at ~0.1 in the weighted
# joint metric, so the shelf env's 0.4 would jump several via-points ahead
# and cut the pre-grasp -> grasp and pre-place -> place corners.
arm_advance_radius: 0.15
# Constant carrot lookahead for the streaming executor (see
# CarrotArmMotion3DPlanExecutor): the commanded target is interpolated
# along the plan at this fixed distance ahead of the perceived joints,
# which removes the tick-to-tick lead alternation (arm speed surging,
# perceived as jitter) that discrete waypoint advance produces on this
# env's densely spaced planar plans.
arm_lookahead: 0.25
# Slower lookahead for the settle move right after a teleop hand-back, and
# the stand-clear countdown (seconds) printed before that move starts.
settle_arm_lookahead: 0.1
settle_countdown_seconds: 3.0
# Visual-servo gap executor (env.real_gap=visual_servo): lateral gain in
# metres per pixel and its sign. In the simulator's wrist camera 3 cm of
# lateral offset is ~65 px, so 0.0003 m/px under-corrects slightly and
# converges in a few 1 cm steps.
servo_lateral_gain: 0.0003
servo_lateral_sign: 1.0
arm_arrival_tolerance: 0.4
# Ticks the executor holds the arm at the grasp pose after commanding the
# gripper to close, so the real Robotiq (~1-2 s to close) finishes before
# the stow begins. ~20 ticks is ~2 s at the real ~0.104 s tick rate. Fake
# mode runs with control_period 0, so the dwell costs nothing there and
# no per-mode override is needed.
arm_gripper_dwell_ticks: 20
# Gripper position commanded for a "close" (1.0 = fully closed). The
# Pringles can is compliant and a full close crushes it, so stop short:
# tune so the fingers squeeze just enough to hold the can. Override on the
# CLI with `env.gripper_close_position=0.8`.
gripper_close_position: 0.7

pipelines:
  fake:
    real_env:
      _target_: prpl_tidybot.real_env.RealTidyBotEnv
      # FakeInterface stores commanded poses, so the executor converges on
      # the first tick; skip the per-tick sleep to keep tests fast.
      control_period: 0.0
      interface:
        _target_: prpl_tidybot.interfaces.interface.FakeInterface
    perceiver:
      _target_: prpl_tidybot.real_sim.perceivers.kinematic3d.CylinderShelf3DPerceiver
      cylinders: ${env.cylinders}
      targets:
        _target_: prpl_tidybot.real_sim.perceivers.target_source.ConstantCylinderTargets
        cylinders: ${env.cylinders}
      shelf_pose: ${env.shelf_pose}
    plan_executor:
      _target_: prpl_tidybot.real_sim.plan_executors.kinematic3d.Kinematic3DPlanExecutor
      base_executor:
        _target_: prpl_tidybot.real_sim.plan_executors.base_motion3d.PurePursuitBaseMotion3DPlanExecutor
        # The pre-grasp pose stages the base ~0.85 m from the cylinder, so a
        # heading error of x rad puts the cylinder 0.85x m sideways in the
        # wrist camera: the default 0.1 rad allowed 8 cm, which took the
        # cylinder half out of the servo's frame. 0.03 rad is ~2.5 cm.
        angle_tolerance: 0.03
      arm_executor:
        _target_: prpl_tidybot.real_sim.plan_executors.arm_motion3d.CarrotArmMotion3DPlanExecutor
        distance_fn:
          _target_: prpl_tidybot.real_sim.plan_executors.distance_factories.create_kinova_distance_fn
        advance_radius: ${env.arm_advance_radius}
        arrival_tolerance: ${env.arm_arrival_tolerance}
        max_iter_total: 300
        gripper_dwell_ticks: ${env.arm_gripper_dwell_ticks}
        lookahead: ${env.arm_lookahead}
        gripper_close_position: ${env.gripper_close_position}
      # Handles the SkillCall left by a magic skill: drives the base and
      # arm to the skill's predicted configuration with the same
      # sub-executor types as above (instantiated separately).
      gap_executor:
        _target_: prpl_tidybot.real_sim.plan_executors.gap.SettleGapExecutor
        base_executor: ${env.pipelines.fake.plan_executor.base_executor}
        arm_executor: ${env.pipelines.fake.plan_executor.arm_executor}
  sim:
    real_env:
      _target_: prpl_tidybot.sim_env.KinderSimEnv
      env_id: ${env.make_kwargs.id}
      # Same custom env config as the planner's ref env / internal sim
      # (see env.env_model_kwargs.config above) so the shadow sim used
      # by the preview / recorder also stages the shelf at env.shelf_pose
      # instead of CylinderShelf3DEnvConfig's default (2.0, 2.4, 0.02).
      # Without this, the planned-trajectory preview shows the shelf in
      # the wrong place.
      config: ${env.env_model_kwargs.config}
      # Enable inner-env `set_state` so this same pipeline can serve as
      # a shadow sim for the side-by-side video recorder.
      allow_state_access: true
    perceiver:
      _target_: prpl_tidybot.real_sim.perceivers.passthrough.PassThroughPerceiver
    plan_executor:
      _target_: prpl_tidybot.real_sim.plan_executors.passthrough.PassThroughPlanExecutor
  real:
    real_env:
      _target_: prpl_tidybot.real_env.RealTidyBotEnv
      interface:
        _target_: prpl_tidybot.interfaces.interface.RealInterface
        # Real arm + real base — the planner commands both for pick/place.
        # Camera stays faked: perception of the cylinder is via the ceiling
        # marker detector (see `target_source` below), not the on-robot
        # cams, and `get_observation` would otherwise hit
        # NotImplementedError on the real cams.
        base_interface:
          _target_: prpl_tidybot.interfaces.base_interface.RealBaseInterface
          marker_detector_host: ${lab.marker_detector_host}
        camera_interface:
          _target_: prpl_tidybot.interfaces.camera_interface.FakeCameraInterface
      # Off-host render source: subscribes to the JPEG image publisher running
      # inside the marker-detector daemon. Lets `record.video=true` work on the
      # real pipeline without the on-robot base camera being wired up.
      renderer:
        _target_: prpl_tidybot.rendering.CeilingCameraRenderer
    perceiver:
      _target_: prpl_tidybot.real_sim.perceivers.kinematic3d.CylinderShelf3DPerceiver
      cylinders: ${env.cylinders}
      targets:
        _target_: prpl_tidybot.real_sim.perceivers.target_source.MarkerDetectorCylinderTargets
        cylinders: ${env.cylinders}
      shelf_pose: ${env.shelf_pose}
    # Same sub-executors as fake mode; the magic gap goes to the executor
    # selected by `env.real_gap` (see `real_gap_executors` below).
    plan_executor:
      _target_: prpl_tidybot.real_sim.plan_executors.kinematic3d.Kinematic3DPlanExecutor
      base_executor: ${env.pipelines.fake.plan_executor.base_executor}
      arm_executor: ${env.pipelines.fake.plan_executor.arm_executor}
      gap_executor: ${env.real_gap_executors.${env.real_gap}}

# How a magic gap is carried out in real mode:
#   teleop        - the arm is released to the Kinova's own gamepad teleoperation
#                   until the operator presses Enter, then the robot settles to
#                   the skill's predicted configuration.
#   visual_servo  - the robot centers the cylinder in the wrist camera, drives
#                   the gripper forward, closes, and settles; no human in the
#                   loop. Only for the last-mile Grasp from the pre-grasp pose.
# Override on the CLI with `env.real_gap=visual_servo`.
real_gap: teleop
real_gap_executors:
  teleop:
    _target_: prpl_tidybot.real_sim.plan_executors.gap.TeleopGapExecutor
    base_executor: ${env.pipelines.fake.plan_executor.base_executor}
    # The settle after the hand-back is a single unplanned joint-space
    # move with the operator nearby, so it runs with a shorter carrot
    # lookahead than the planned arm segments (slower cruise), after
    # a stand-clear countdown.
    arm_executor:
      _target_: prpl_tidybot.real_sim.plan_executors.arm_motion3d.CarrotArmMotion3DPlanExecutor
      distance_fn:
        _target_: prpl_tidybot.real_sim.plan_executors.distance_factories.create_kinova_distance_fn
      advance_radius: ${env.arm_advance_radius}
      arrival_tolerance: ${env.arm_arrival_tolerance}
      max_iter_total: 300
      gripper_dwell_ticks: ${env.arm_gripper_dwell_ticks}
      lookahead: ${env.settle_arm_lookahead}
      gripper_close_position: ${env.gripper_close_position}
    countdown_seconds: ${env.settle_countdown_seconds}
  visual_servo:
    _target_: prpl_tidybot.real_sim.plan_executors.visual_servo.CylinderVisualServoGapExecutor
    image_source:
      _target_: prpl_tidybot.visual_servo.image_sources.KinovaWristCameraSource
    base_executor: ${env.pipelines.fake.plan_executor.base_executor}
    arm_executor: ${env.real_gap_executors.teleop.arm_executor}
    # Metres of lateral tool motion per pixel of cylinder offset, and its
    # sign for the wrist camera's horizontal axis; confirm both with
    # hardware_tests/test_visual_servo_grasp.py before a rollout.
    lateral_gain: ${env.servo_lateral_gain}
    lateral_sign: ${env.servo_lateral_sign}
    lateral_tolerance_px: 8.0
    lateral_max_step: 0.01
    # Every non-zero correction is at least this large: the compliant
    # controller ignores targets a few millimetres away, so smaller nudges
    # would only accumulate and release in a jump. Keep below twice the
    # tolerance in metres (~6 mm at the grasp standoff).
    lateral_min_step: 0.006
    # During alignment a detection whose width jumps by more than this
    # fraction from the previous one is ignored (a background edge paired
    # with one cylinder edge).
    max_width_change_frac: 0.3
    # While aligning, a detection is also held to the width the cylinder's
    # radius predicts at the pre-grasp standoff (focal_px * diameter /
    # (camera_to_grasp_offset + approach_distance)), within these factors:
    # a sliver of label or a dark strip at the frame's edge is not the
    # cylinder. focal_px was fitted on 2026-08-29 (207 px for a 78 mm can
    # at 0.208 m).
    focal_px: 552.0
    width_plausibility: [0.5, 1.6]
    # After alignment the approach is open loop, straight along the tool's
    # approach axis. Its length is estimated from how fast the cylinder's
    # apparent width grows over the first range_baseline metres (motion
    # parallax; no diameter or focal length needed) minus the camera-to-
    # grasp offset, a robot constant: on 2026-08-29 the Pringles can read
    # 207 px at the aligned pre-grasp pose and 229 px two centimetres in,
    # giving a camera-to-axis distance of 0.208 m, and a 0.10 m approach
    # grasped it, hence 0.108 (which also matches the wrist camera's
    # mounting offset). approach_distance is the fallback when the
    # estimate is missing or implausible; the pre-grasp pose is
    # PRE_GRASP_BACKOFF (0.10 m) behind the grasp.
    estimate_range: true
    range_baseline: 0.04
    camera_to_grasp_offset: 0.108
    approach_min: 0.04
    approach_max: 0.20
    approach_distance: 0.10
    approach_step: 0.01
    # Forward steps stream, one every approach_ticks_per_step ticks (~3 cm/s
    # at 1 cm steps), so the approach is one continuous motion; aligning
    # steps wait up to step_timeout_ticks for the arm before the next frame
    # is trusted.
    approach_ticks_per_step: 3
    step_timeout_ticks: 4
    gripper_dwell_ticks: ${env.arm_gripper_dwell_ticks}
    gripper_close_position: ${env.gripper_close_position}
    # Safety stops, both raise ExecutionFailure (rollout ends, arm holds):
    # the most any single joint may change for one 1 cm step (an IK branch
    # flip would be far larger), and the total sideways travel of the
    # commanded target from where the servo started (a persistent
    # misdetection would walk the arm further). Base staging has been off
    # by up to ~4 cm, and the commanded target leads the arm by the
    # controller's deadband (~2-3 cm), so 8 cm leaves room for a real
    # correction.
    max_joint_step: 0.2
    lateral_travel_limit: 0.08
    # Annotated wrist frames for every servo tick land here (set to null
    # to skip).
    debug_dir: ${hydra:runtime.output_dir}/visual_servo
