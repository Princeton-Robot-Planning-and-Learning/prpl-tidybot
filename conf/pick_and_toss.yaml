# Config for scripts/pick_and_toss.py: pick the floor cube with the shelf3d
# PickController (no task planner, no Place), then toss it.
#
#   python scripts/pick_and_toss.py mode=fake
#   python scripts/pick_and_toss.py mode=real toss.max_vel=80
#   python scripts/pick_and_toss.py mode=real skip_pick=true   # hand the object in
#   python scripts/pick_and_toss.py mode=real skip_toss=true   # pick and hold
#   python scripts/pick_and_toss.py mode=real cycles=5         # pick, toss, repeat
#
# Everything in config.yaml (seed, agent.max_skill_horizon, preview, lab) still
# applies; the env is the kinematic shelf3d env and its fake/sim/real pipelines.

defaults:
  - config
  - override env: kinematic-shelf3d-o1
  - _self_

# Skip the pick: open the gripper, wait for the operator to hand the object in
# (or leave it empty), close the gripper, toss. Uses only the arm interface
# below, so neither the base nor the perceiver is needed.
skip_pick: false
# Pick and stop, holding the cube.
skip_toss: false

# Pick -> toss -> wait for the cube to settle -> re-perceive it -> repeat, for
# this many cycles. More than one needs the pick, the toss and the capture (the
# landing readout is what decides whether the next pick is attempted). The
# loop stops early, logging why, when the cube is not visible, lies outside
# the base pose bounds (preview.floor_bounds) or loop.pickable_region, is not
# perceived where it landed, a pick fails, the arm faults, or a confirmation
# is declined. Per-cycle results go to cycles.json in the log dir, and with
# cycles > 1 each cycle's toss video and outcome to cycle_NN/.
cycles: 1

loop:
  # Ask for the plan preview and the toss confirmation on the first cycle
  # only (real mode). The preview's floor check still runs every cycle.
  confirm_first_cycle_only: false
  # Map-frame [x_min, x_max, y_min, y_max] the cube must lie in for the next
  # pick to be attempted.
  pickable_region: ${preview.floor_bounds}
  # How far (m) the re-perceived cube may be from where the ceiling saw it
  # land before the loop refuses to pick.
  max_landing_disagreement_m: 0.1

# Stdin prompts (toss confirmation, hand-in). null = only in mode=real, like
# the plan preview.
interactive: null

pick:
  # Parameter samples tried for the PickController before giving up. Each
  # rollout runs in the planner's own simulator model for at most
  # agent.max_skill_horizon steps.
  max_attempts: 20

toss:
  # Kortex degrees of joint 1 at the throw.
  heading: 0.0
  # Peak speed of the joint that moves furthest (joint 6), deg/s. Jimmy's toss
  # is 140; start low and step up.
  max_vel: 60.0
  # Cycle (ms) of the 1 kHz swing at which the gripper opens. A fixed cycle,
  # so the release point moves along the swing with max_vel (600 ms is 41% of
  # the way at 140 deg/s, 24% at 60 deg/s); the log prints it before the
  # throw.
  gripper_release_ms: 600
  # Gripper target when closing on a handed-in object (1 = closed).
  gripper_close_position: 1.0
  # How long to wait for the gripper to stop moving after a hand-in command.
  gripper_settle_timeout_s: 5.0

# Arm interface for skip_pick runs, per mode.
toss_only:
  arm_interface:
    fake:
      _target_: prpl_tidybot.interfaces.arm_interface.FakeArmInterface
    real:
      _target_: prpl_tidybot.interfaces.real_arm_interface.RealArmInterface

# Ceiling-camera video of the toss and the landing readout, written to the
# run's log dir as toss.mp4 and toss_outcome.json. Needs the marker-detector
# daemon (marker poses on 6002, top-camera JPEGs on 6003) in mode=real; set
# capture.enabled=false for a toss without it.
capture:
  enabled: true
  fps: 15
  # Film for this long after the toss returns.
  post_toss_record_s: 4.0
  # Wait this long after the toss before reading the cube's markers.
  settle_s: 2.0
  # Cube-face marker ids (subset of TARGET_MARKER_IDS). The default leaves
  # out 35-37, which sit under the cylinder-shelf env's cylinders.
  cube_marker_ids: [23, 38, 39, 40, 41, 42, 43, 44, 45, 46]
  pipelines:
    fake:
      renderer:
        _target_: prpl_tidybot.rendering.CeilingCameraRenderer
        client:
          _target_: prpl_tidybot.marker_detector.ceiling_image_client.FakeCeilingImageClient
      marker_client:
        _target_: prpl_tidybot.marker_detector.client.FakeMarkerDetectorClient
        robot_pose: [0.0, 0.0, 0.0]
        # The fake cube "lands" where fake mode perceives it.
        targets: [[23, "${env.cube_pose.0}", "${env.cube_pose.1}"]]
    real:
      renderer:
        _target_: prpl_tidybot.rendering.CeilingCameraRenderer
        host: ${lab.marker_detector_host}
      marker_client:
        _target_: prpl_tidybot.marker_detector.client.MarkerDetectorClient
        host: ${lab.marker_detector_host}
