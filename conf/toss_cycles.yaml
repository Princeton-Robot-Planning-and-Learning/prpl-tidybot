# Config for scripts/toss_cycles.py: repeat, `cycles` times,
#   pick the cube (ends in the carry pose) -> drive to toss_pose -> toss -> retract,
# confirming each action on stdin in mode=real, and whenever the run stops (done,
# declined, cube not found, failure) retract the arm and drive back to toss_pose.
#
#   python scripts/toss_cycles.py mode=fake
#   python scripts/toss_cycles.py mode=real
#
# Everything in pick_and_toss.yaml (pick, toss, env floor-cube-o1, preview) applies.

defaults:
  - pick_and_toss
  - _self_

cycles: 2

# Where every throw starts: map-frame (x, y, heading rad), facing -x down the open
# half of the room. The first real throw (140 deg/s, 600 ms) came to rest 2.34 m from
# the base, past the localizer's search box when thrown from the lab start pose
# (x = 0.489). Here the base's back edge (0.274 m behind its centre) stops 0.1 m
# inside the box (x_max 1.7), and that throw lands ~0.48 m inside it, pickable again.
toss_pose: [1.326, -0.493, -3.132]

toss:
  max_vel: 140.0
  gripper_release_ms: 600

# The cube carries no markers, so the marker-based landing capture is off; the next
# localization (or the final one) records where each throw landed.
capture:
  enabled: false

# Whole-run video from the ceiling cameras (both, stitched), labelled with the current
# step: <log dir>/ceiling.mp4.
ceiling_video:
  enabled: true
  fps: 10
  scale: 0.5
  host: ${lab.marker_detector_host}

arm_home:
  # Compliant-loop moves: joint-space tolerance (rad, wrapped) and the most policy
  # ticks to wait for it.
  tolerance: 0.05
  max_ticks: 100

pick:
  # top_down: Jimmy Wu's TidyBot pick_object, ported (prpl_tidybot.top_down_pick).
  # kinder: the kinder shelf3d PickController through the planner pipeline.
  method: top_down
  top_down:
    # Gripper reach from the arm mount at the grasp; the base parks reach +
    # mounting_offset (0.67 m) from the cube, facing it.
    reach: 0.55
    # Floor height in the arm's frame. KINDER's TidyBot model mounts the arm 0.3948 m
    # above the floor (pybullet_helpers tidybot.py); the kinder pick, which uses that
    # model, reached the cube's height on the robot. third_party HEIGHT_OFFSET (-0.348)
    # is the old stack's Kortex tool-frame pick height, a different convention.
    floor_z: -0.395
    # The finger pads reach 2.95 cm below the IK's pinch point; at the grasp they stop
    # pad_clearance above the floor (aiming the pinch point at the cube's middle put
    # them 4 mm into it). Hover is above the grasp.
    pad_clearance: 0.012
    hover_height: 0.10
    # Added to the cube's yaw to square the fingers to its faces (tune on the robot).
    wrist_yaw_offset_deg: 0.0
    # Closed on nothing reads ~1.0; on the 5 cm cube it read 0.49.
    grasp_min: 0.2
    grasp_max: 0.9
    close_position: 1.0
    # angular: the arm's onboard position controller (Jimmy Wu's pick_object); lands
    # within 0.1 deg, which the wrist servo's step-and-look needs. compliant: the
    # torque loop; it settles 4-5 deg short and then creeps for seconds (run 9: the
    # hover 48 mm short, a 15 mm probe moved 40 mm), so the servo could not converge.
    # One controller per run.
    arm_controller: angular
    arrive_deg: 1.0
    # The compliant descent is corrected: after the arm settles the pinch point is
    # re-aimed by the measured position error, up to correction_rounds times, until
    # within correction_tol_mm, at most correction_max_mm past the goal and never
    # below the grasp height.
    correction_rounds: 3
    correction_tol_mm: 2.0
    correction_max_mm: 60.0
    correction_tol_deg: 0.3
    correction_max_deg: 8.0
    # Align over the cube with the wrist camera at the hover before descending
    # (prpl_tidybot.visual_servo.top_down_cube). x/y nudges at the hover height and
    # a wrist turn to square the fingers; never moves the gripper down.
    wrist_servo:
      enabled: true
      # Where the cube sits in the wrist image when the pinch point is above it: the
      # mean over the 4 held picks of 2026-10-14 (spread +-7, +-14 px).
      target_uv: [318, 280]
      probe_step: 0.015
      tolerance_px: 6.0
      confirm_looks: 3
      min_step: 0.002
      max_step: 0.01
      max_area_change_frac: 0.3
      # At 1 cm per nudge a cube ~6 cm off (the camera-overlap strip) needs 7-8.
      max_moves: 10
      travel_limit: 0.08
      align_yaw: true
      settle_s: 0.3
    # Refuse a servo nudge whose IK jumps an arm joint by more than max_joint_step rad
    # (the wrist may turn up to max_wrist_step to square the fingers).
    max_joint_step: 0.2
    max_wrist_step: 0.9
    gripper_timeout_s: 4.0
    # One attempt: a miss retracts, returns to the toss pose and ends the run.
    max_attempts: 1
    # After a missed pick: retract, ask the person to move the cube, and try again
    # (this many times; 0 ends the run on a miss as before).
    ask_to_move_after_miss: 3
    # Record the wrist camera during each pick attempt (real mode).
    record_wrist: true
    # Fake mode only: the gripper reading to pretend after closing.
    fake_grasp_reading: 0.49

# Stop after the pick, holding the cube (then the reset prompt).
skip_toss: false

# once: one confirmation before the first action covers the whole run (Ctrl-C still
# stops the arm); each: confirm every action.
confirm: once

# Seconds to wait after each toss before anything looks for the cube. Localizing right
# after the swing caught the cube mid-flight and mid-slide (at rest ~1.6 s after
# release) and rejected it.
settle_after_toss_s: 5.0
