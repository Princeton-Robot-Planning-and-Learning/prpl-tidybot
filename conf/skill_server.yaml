# Config for scripts/skill_server.py: Tossing3D's skills on the real robot, one RPC
# call each (prpl_tidybot.skill_server). Runs ON the NUC next to the arm and base
# servers; a planner on the LAN connects with TossingRobotClient.
#
#   python scripts/skill_server.py mode=real
#   python scripts/skill_server.py mode=fake      # no robot: the same skills, faked
#   python scripts/skill_server.py mode=sim       # the kinematic TidyBot (cfg.sim)
#
# The real room of 2026-10-20: everything in same_side_practice.yaml (the measured
# tape, the pick out of the bin, the lateral wrist servo, the compliant arm) and
# toss_cycles.yaml (the measured bin and its saturation mask, real_toss_bounds,
# settle_after_toss_s), with the bin searched for at both of its spots.

defaults:
  - same_side_practice
  - _self_

# The planner confirms nothing on stdin; the server never prompts.
interactive: false

# Home (go_home's goal): the close-side toss stand, 1.39 m +x of that spot's bin.
toss_pose: [1.10, -0.78, 3.141592653589793]

toss:
  # The real robot throws at each bin spot from one fixed side (toss(direction=None)):
  # the close spot (bin about (-0.29, -0.77), on the robot's side of the tape) from
  # +x, the far spot (bin box x 0.03..0.45, y 1.24..1.56, across the tape) from -y,
  # i.e. from the stand (0.24, 0.01, +90 deg) at 1.39 m. Azimuths, map frame, bin
  # centre -> robot, rad.
  spot_directions:
    robot_side: 0.0
    far_side: -1.5707963267948966

pick:
  top_down:
    # The 2026-10-20 pilot's grasps, off the floor and out of the bin: the arm's
    # onboard position controller (the toss keeps the arm server's own swing).
    arm_controller: angular
  # Attempts per pick() call. After a miss the robot retracts, drives back to
  # toss_pose (where the ceiling cameras see the cube without the robot over it),
  # localizes the bin and the cube again and re-plans; missing every attempt, it ends
  # there. toss_cycles passes 1: it asks its operator between attempts itself.
  max_attempts: 2

bin:
  # Both spots: the drivable box plus 0.3 m.
  search_bounds: [-1.8, 2.0, -1.8, 1.8]
  # The rim-edge detector (toss_cycles.yaml's bin.method): replaying the 2026-10-20
  # pilot's 131 looks (51 saved frame sets, 80 video windows) it found the bin in
  # 131/131 within 2.6 cm, returned no bin in 131/131 of them with the bin hidden
  # and 8/8 with it against the wall, and is unchanged under dimmer, brighter,
  # paler and warmer lighting. method: saturation falls back to the thresholds below.
  method: rim_edges
  # method: saturation's HSV saturation threshold per ceiling camera (the lab's
  # camera_serials): the top camera sees the far spot, the bottom one the close spot.
  # Replaying the 2026-10-20 pilot's frames, 160/130 found the bin in 57/57 far and
  # 41/41 close looks. One number for both cameras also works: 140 found 56/57 far,
  # 41/41 close (the pilot ran on it).
  min_saturation:
    AD8A29AE: 160.0
    5A5C29AE: 130.0
  # A real cube cannot rest on the rim: a centre inside the walls is in the bin
  # (pilot run9's far throw, 91.5 mm off-centre across the 0.29 m bin, did not score
  # with toss_cycles' 5 cm margin).
  in_bin_margin: 0.0

skill_server:
  # Bind address on the NUC (all interfaces, so agni can reach it) and port, next to
  # the base (50000) and arm (50001) servers. The authkey is
  # third_party.constants.RPC_AUTHKEY. Clients connect to ${lab.nuc_ip}.
  host: 0.0.0.0
  port: 50002
  # observe()["cube_upright"]: the cube's flat-cube silhouette fit scored at least
  # this IoU (a cube resting on a face fits at ~0.9; the localizer drops a fit below
  # its own min_iou, 0.6).
  upright_min_iou: 0.75

recording:
  # The skill server samples the arm's joints, the gripper, the base's odometry and
  # map poses and the skill call in progress this often (Hz) into
  # <log dir>/motion.jsonl, read only, so a real session can be replayed in sim
  # (prpl_tidybot.motion_log). 0 turns it off.
  motion_hz: 20.0
